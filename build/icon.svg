<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- App icon: the DronoSim brand mark from index.html on the app's dark panel colour.
       build/icon.png (1024 px) is rendered from this file; electron-builder makes .icns and .ico from it. -->
